name: Startplatz-Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Nur Testnachricht schicken"
        type: boolean
        default: false

concurrency:
  group: startplatz-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAGE_URL: ${{ vars.PAGE_URL }}
      NO_SPOTS_TEXT: ${{ vars.NO_SPOTS_TEXT }}
      SPOT_TEXT: ${{ vars.SPOT_TEXT }}
      USE_BROWSER: ${{ vars.USE_BROWSER }}
      REMIND_EVERY_RUNS: ${{ vars.REMIND_EVERY_RUNS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Playwright installieren (nur wenn USE_BROWSER=1)
        if: ${{ vars.USE_BROWSER == '1' }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Zustand laden
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Seite prüfen
        run: python monitor.py ${{ inputs.test && '--test' || '' }}

      - name: Zustand speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}
